name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Typecheck and build (app-shell)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-shell/package-lock.json   # commit the lockfile after the first local `npm install`
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:   # build-time placeholders only. Real values live in Coolify, never in GitHub.
          NEXT_PUBLIC_SITE_URL: https://example.test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app-shell
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://example.test
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
