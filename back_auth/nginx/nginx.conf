upstream bukz {
    server web:8000;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;

# HTTP: only redirect (and answer ACME challenges if you use certbot webroot)
server {
    listen 80;
    server_name bukmarkz.com www.bukmarkz.com api.bukmarkz.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bukmarkz.com www.bukmarkz.com api.bukmarkz.com;

    # certbot / your CA: mount the certificates into the container
    ssl_certificate     /etc/letsencrypt/live/bukmarkz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukmarkz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;                       # matches DATA_UPLOAD_MAX_MEMORY_SIZE

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Django sets HSTS itself (SECURE_HSTS_*); do not add it twice.

    location / {
        root   /app/build;
        try_files $uri /index.html;                 # single-page app fallback
    }

    # Django admin: reachable only from addresses you list (office / VPN). Everything else gets 404.
    location /api/admin/ {
        allow 203.0.113.10;                         # <- REPLACE with your VPN / office IP, then remove this comment
        deny  all;
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://bukz;
    }

    # credential endpoints: strict per-IP limit on top of Django's own throttles
    location ~ ^/api/(login|register|auth|passkey|password_reset) {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://bukz;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://bukz;
    }

    location /staticfiles/ { root /home/app/web; expires 7d; }
    location /media/ {
        root /home/app/web;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;   # uploaded files can never run script
        add_header X-Content-Type-Options "nosniff" always;
    }
}
