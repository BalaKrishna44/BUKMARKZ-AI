proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # DRF NUM_PROXIES = 1 trusts exactly this one hop
proxy_set_header X-Forwarded-Proto $scheme;                    # Django's SECURE_PROXY_SSL_HEADER reads this
proxy_redirect off;
proxy_read_timeout 60s;
